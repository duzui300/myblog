<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600" fill="none">
  <style>
    .bg-paper { fill: #F3EFE5; fill: var(--paper, #F3EFE5); }
    .ink-fill { fill: #252831; fill: var(--ink, #252831); }
    .ink-stroke { stroke: #252831; stroke: var(--ink, #252831); fill: none; }
    .oxide-fill { fill: #A16B54; fill: var(--oxide, #A16B54); }
    .brass-fill { fill: #A58D61; fill: var(--brass, #A58D61); }
  </style>

  <defs>
    <!-- 柱身底部向纸面消隐的渐变 -->
    <linearGradient id="pillarFade" x1="450" y1="250" x2="450" y2="306" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#252831" style="stop-color: var(--ink, #252831);" stop-opacity="1" />
      <stop offset="56%" stop-color="#252831" style="stop-color: var(--ink, #252831);" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#252831" style="stop-color: var(--ink, #252831);" stop-opacity="0" />
    </linearGradient>

    <!-- 穿过立柱中缝时变淡的下方星芒垂直光线渐变 -->
    <linearGradient id="rayFade" x1="450" y1="170" x2="450" y2="306" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A16B54" style="stop-color: var(--oxide, #A16B54);" stop-opacity="1" />
      <stop offset="30%" stop-color="#A16B54" style="stop-color: var(--oxide, #A16B54);" stop-opacity="1" />
      <stop offset="42%" stop-color="#A16B54" style="stop-color: var(--oxide, #A16B54);" stop-opacity="0.22" />
      <stop offset="82%" stop-color="#A16B54" style="stop-color: var(--oxide, #A16B54);" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#A16B54" style="stop-color: var(--oxide, #A16B54);" stop-opacity="0" />
    </linearGradient>

    <!-- 柱头横带的左右内凹弧线裁切轮廓 -->
    <clipPath id="echinusInwardClip">
      <path d="M 419.5 225.0 Q 427.5 235.5 425.0 246.0 L 475.0 246.0 Q 472.5 235.5 480.5 225.0 Z" />
    </clipPath>
  </defs>

  <!-- 暖羊皮纸背景（如需透明底融入网页，删除此行即可） -->
  <rect class="bg-paper" fill="#F3EFE5" width="900" height="600" />

  <!-- ==================== 极简天体与古典柱头徽记 ==================== -->
  <g id="artistic-emblem">
    <!-- 1. 严格位于 r=96 正圆轨迹上的留白圆弧 (圆心 450, 182) -->
    <g class="ink-stroke" stroke="#252831" stroke-width="1.15" stroke-linecap="round">
      <path d="M 355.46 165.33 A 96 96 0 0 1 439.97 86.53" />
      <path d="M 460.03 86.53 A 96 96 0 0 1 515.47 111.79" />
      <path d="M 530.51 129.71 A 96 96 0 0 1 545.47 171.97" />
      <path d="M 544.82 197.02 A 96 96 0 0 1 478.07 273.80" />
      <path d="M 421.93 273.80 A 96 96 0 0 1 384.53 252.21" />
      <path d="M 369.49 234.29 A 96 96 0 0 1 354.53 192.03" />
    </g>

    <!-- 2. 中心天体素描正圆 (cx=450, cy=170, r=27) -->
    <circle class="ink-stroke" stroke="#252831" cx="450" cy="170" r="27" stroke-width="0.85" stroke-opacity="0.55" />
    <path class="ink-stroke" stroke="#252831" d="M 450 143 A 14 27 0 0 1 450 197" stroke-width="0.75" stroke-opacity="0.35" />

    <!-- 3. 倾斜椭圆轨道（大圆后方靠上那一段已隐去） -->
    <g class="ink-stroke" stroke="#252831" stroke-width="1.15" stroke-linecap="round">
      <path d="M 255.22 249.07 A 206 38 -19 0 1 349.51 180.91" />
      <path d="M 528.52 119.27 A 206 38 -19 0 1 502.60 203.20" />
      <path d="M 391.75 239.58 A 206 38 -19 0 1 255.22 249.07" />
    </g>

    <!-- 4. 双行星（严格落在椭圆轨道线上，古铜金无描边实心点缀） -->
    <circle class="brass-fill" fill="#A58D61" cx="323.6" cy="254.4" r="10" />
    <circle class="brass-fill" fill="#A58D61" cx="613.5" cy="152.0" r="13.5" />
    <!-- 大圆内极简星尘点 -->
    <circle class="ink-fill" fill="#252831" cx="426" cy="116" r="1.5" />
    <circle class="ink-fill" fill="#252831" cx="518" cy="214" r="1.8" />

    <!-- 大圆内部点缀的 3 颗小四芒星（氧化红） -->
    <!-- 大圆内左上方 -->
    <path class="oxide-fill" fill="#A16B54" d="M 405 122.5 Q 405.9 128.1 411.5 129 Q 405.9 129.9 405 135.5 Q 404.1 129.9 398.5 129 Q 404.1 128.1 405 122.5 Z" />
    <!-- 大圆内右上方 -->
    <path class="oxide-fill" fill="#A16B54" d="M 495 128.5 Q 495.8 133.2 500.5 134 Q 495.8 134.8 495 139.5 Q 494.2 134.8 489.5 134 Q 494.2 133.2 495 128.5 Z" />
    <!-- 大圆内左下方（水平星芒之下、立柱左侧） -->
    <path class="oxide-fill" fill="#A16B54" d="M 388 188 Q 388.7 192.3 393 193 Q 388.7 193.7 388 198 Q 387.3 193.7 383 193 Q 387.3 192.3 388 188 Z" />

    <!-- 5. 标准八芒星：四长四短（氧化红，中心 450, 170） -->
    <g>
      <!-- 穿过立柱中缝并变淡的下方长星芒 -->
      <path fill="url(#rayFade)" d="M 448.3 170 L 451.7 170 L 450 306 Z" />
      <!-- 上、左、右三道长星芒 + 四道 45° 对角短星芒 -->
      <path
        class="oxide-fill"
        fill="#A16B54"
        d="M 450.0 64.0
           L 451.7 165.9
           L 466.0 154.0
           L 454.1 168.3
           L 528.0 170.0
           L 454.1 171.7
           L 466.0 186.0
           L 451.7 174.1
           L 450.0 174.5
           L 448.3 174.1
           L 434.0 186.0
           L 445.9 171.7
           L 372.0 170.0
           L 445.9 168.3
           L 434.0 154.0
           L 448.3 165.9 Z"
      />
    </g>

    <!-- 6. 爱奥尼亚立柱：上下平直顶檐 + 平直一体双涡卷与第一道黑带合一 + 内收横带 + 四道圆头柱槽 -->
    <g id="ionic-column">
      <!-- 顶部额枋：上平圆角、下缘平直，两端微垂贴合涡卷外肩 -->
      <path
        class="ink-fill"
        fill="#252831"
        d="M 400.5 213.5
           L 499.5 213.5
           Q 505.5 213.5 505.5 219.0
           L 505.5 224.2
           Q 501.0 221.4 493.0 221.4
           L 407.0 221.4
           Q 399.0 221.4 394.5 224.2
           L 394.5 219.0
           Q 394.5 213.5 400.5 213.5 Z"
      />

      <!-- 左右一体式粗线涡卷（中间横线完全平直于 y=227.2，与下方第一道黑带合为一体） -->
      <g class="ink-stroke" stroke="#252831" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round">
        <!-- 左涡卷 -->
        <path
          d="M 450.0 227.2
             L 414.5 227.2
             C 402.0 227.2, 396.5 232.8, 396.5 240.0
             C 396.5 247.2, 402.2 251.5, 409.2 251.5
             C 415.2 251.5, 419.2 247.2, 419.2 241.5
             C 419.2 236.5, 415.2 233.2, 410.4 233.2
             C 406.4 233.2, 404.0 236.0, 404.0 239.5
             C 404.0 242.2, 406.0 244.0, 408.6 244.0"
        />
        <!-- 右涡卷（围绕 x=450 严格镜像对称） -->
        <path
          d="M 450.0 227.2
             L 485.5 227.2
             C 498.0 227.2, 503.5 232.8, 503.5 240.0
             C 503.5 247.2, 497.8 251.5, 490.8 251.5
             C 484.8 251.5, 480.8 247.2, 480.8 241.5
             C 480.8 236.5, 484.8 233.2, 489.6 233.2
             C 493.6 233.2, 496.0 236.0, 496.0 239.5
             C 496.0 242.2, 494.0 244.0, 491.4 244.0"
        />
      </g>

      <!-- 柱颈横带（第一道粗带与上方平直涡卷横线完全融合；下两道偏细，两侧沿内凹弧线收腰） -->
      <g class="ink-fill" fill="#252831" clip-path="url(#echinusInwardClip)">
        <!-- 与涡卷横线合为一体的加粗首带 -->
        <rect x="418" y="225.0" width="64" height="6.5" />
        <!-- 中偏细带 -->
        <rect x="418" y="234.4" width="64" height="3.8" />
        <!-- 下偏细带 -->
        <rect x="418" y="241.0" width="64" height="4.4" />
      </g>

      <!-- 4 道顶端圆润的粗柱槽（对称分布，正中留通道供淡色星芒光线穿过） -->
      <g stroke="url(#pillarFade)" stroke-width="5.2" stroke-linecap="round">
        <line x1="430.5" y1="250.5" x2="430.5" y2="304" />
        <line x1="443.2" y1="250.5" x2="443.2" y2="306" />
        <line x1="456.8" y1="250.5" x2="456.8" y2="306" />
        <line x1="469.5" y1="250.5" x2="469.5" y2="304" />
      </g>
    </g>
  </g>

  <!-- ==================== 书志衬线排版 ==================== -->
  <g id="typography">
    <!-- 主标题 DUZUI：左右外缘严格锁定 x=208 与 x=692（几何中点精确为 450.0） -->
    <g
      class="ink-fill"
      fill="#252831"
      text-anchor="middle"
      font-family="'Cormorant Garamond', 'EB Garamond', 'Times New Roman', serif"
      font-size="112"
      font-weight="400"
    >
      <text x="246" y="424">D</text>
      <text x="360" y="424">U</text>
      <text x="462" y="424">Z</text>
      <text x="566" y="424">U</text>
      <text x="674" y="424">I</text>
    </g>

    <!-- 两侧等长细线（各 88px，外端与 DUZUI 外缘齐平，内端与 COSMO IN ME 保持等距 26px） -->
    <line class="ink-stroke" stroke="#252831" x1="208" y1="474" x2="296" y2="474" stroke-width="1.15" />
    <line class="ink-stroke" stroke="#252831" x1="604" y1="474" x2="692" y2="474" stroke-width="1.15" />

    <!-- 副标题 COSMO IN ME：逐字独立精确定位，左右外缘严格对称于 x=450.0 -->
    <g
      class="ink-fill"
      fill="#252831"
      text-anchor="middle"
      font-family="'Cormorant Garamond', 'EB Garamond', 'Times New Roman', serif"
      font-size="25"
      font-weight="400"
    >
      <text x="331" y="482">C</text>
      <text x="357" y="482">O</text>
      <text x="382" y="482">S</text>
      <text x="409" y="482">M</text>
      <text x="436" y="482">O</text>

      <text x="476" y="482">I</text>
      <text x="499" y="482">N</text>

      <text x="544" y="482">M</text>
      <text x="570" y="482">E</text>
    </g>

    <!-- 底部深内凹弧线小星芒（严格居中于 450, 526） -->
    <path
      class="oxide-fill"
      fill="#A16B54"
      d="M 450 511
         C 451.1 521.5, 454.5 524.9, 465 526
         C 454.5 527.1, 451.1 530.5, 450 541
         C 448.9 530.5, 445.5 527.1, 435 526
         C 445.5 524.9, 448.9 521.5, 450 511 Z"
    />
  </g>
</svg>