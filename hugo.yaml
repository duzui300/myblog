baseURL: https://duzui300.github.io/
languageCode: en-us
title: Duzui's Blog
theme: ["PaperMod"]


enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts", "papermod"]

minify:
  disableXML: true
  # minifyOutput: true

pagination:
  disableAliases: false
  pagerSize: 5

languages:
  en:
    languageName: "English"
    weight: 1
    taxonomies:
      category: categories
      tag: tags
      series: series
    menu:
      main:
        - name: Archive
          url: archives
          weight: 5
        - name: Search
          url: search/
          weight: 10
        - name: Tags
          url: tags/
          weight: 10
        - name: WiKi
          url: https://github.com/adityatelange/hugo-PaperMod/wiki/

  ja:
    languageName: "日本語"
    weight: 2
    title: Duzui'sブログ
    taxonomies:
      category: カテゴリ
      tag: タグ
      series: シリーズ
    menu:
      main:
        - name: "ブログ"
          url: posts/
          weight: 1
        - name: アーカイブ
          url: /archives/
          weight: 2
        - name: タグ
          url: tags/
          weight: 3
        - name: 検索
          url: /search/
          weight: 4
        - name: Wiki
          url: https://github.com/adityatelange/hugo-PaperMod/wiki/
    params:
      languageAltTitle: Japanese
      # 这里放日语专属的PaperMod参数覆盖（比如描述、按钮等）
      profileMode:
        enabled: true
        title: プロフィール
        subtitle: "Duzuiだよ"
        imageUrl: "/images/myicon.jpg"
        imageTitle: "アイコン"
        imageWidth: 120
        imageHeight: 120
        buttons:
          - name: ブログ
            url: posts/


  zh-hans:
    languageName: "中文"
    weight: 3
    title: Duzui的博客
    taxonomies:
      category: 分类
      tag: 标签
      series: 系列
    menu:
      main:
        - name: "博客"
          url: posts/
          weight: 1
        - name: "归档"
          url: /archives/
          weight: 2
        - name: "搜索"
          url: /search/
          weight: 3
        - name: "标签"
          url: tags/
          weight: 4
        - name: Wiki
          url: https://github.com/adityatelange/hugo-PaperMod/wiki/
    params:
      languageAltTitle: Chinese
      # 这里放中文专属的PaperMod参数覆盖
      profileMode:
        enabled: true
        title: 欢迎
        subtitle: "Duzui"
        imageUrl: "/images/myicon.jpg"
        imageTitle: "我的头像"
        imageWidth: 120
        imageHeight: 120
        buttons:
          - name: 博客
            url: posts/



outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: "Theme PaperMod - https://github.com/adityatelange/hugo-PaperMod"
  author: Theme PaperMod
  # author: ["Me", "You"] # multiple authors

  defaultTheme: auto
  # disableThemeToggle: true
  ShowShareButtons: true
  ShowReadingTime: true
  # disableSpecial1stPost: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  # comments: false
  images: ["images/papermod-cover.png"]

  profileMode:
    enabled: true           # 启用个人资料主页
    title: "Duzui"      # 主标题（通常是你的名字）
    subtitle: |
      👋 Welcome to my blog!

      ⭐I'm Duzui or duzui9039/duzuictx sometimes. I speak and write in english|普通话|日本語. 
      I'll post some casual passages here, mainly about the books I've read, projects I've done and my language learning experience. 
      También estoy aprendiendo español.
  # 副标题
    imageUrl: "/images/myicon.jpg"  # 头像图片 URL
    imageTitle: "icon"    # 头像的 alt 文本（无障碍/SEO）
    imageWidth: 120         # 可选：头像显示宽度
    imageHeight: 120        # 可选：头像显示高度
    buttons:
      - name: Blog
        url: posts/
  
