baseURL: https://duzui300.github.io/
languageCode: en-us
title: Duzui's Blog
theme: ["PaperMod"]


enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts", "papermod"]

minify:
  disableXML: true
  # minifyOutput: true

pagination:
  disableAliases: false
  pagerSize: 5

# One site, one URL tree. Language is not a site structure — every post lives in /posts/
# and carries a language tag (中文 / 日本語 / English), so /tags/中文/ is the per-language
# view. Adding a language means writing a post and tagging it, not building a new tree.
taxonomies:
  category: categories
  tag: tags
  series: series

menu:
  main:
    - name: Posts
      url: posts/
      weight: 1
    - name: Archive
      url: archives/
      weight: 2
    - name: Tags
      url: tags/
      weight: 3
    - name: Search
      url: search/
      weight: 4
    - name: WiKi
      url: https://github.com/adityatelange/hugo-PaperMod/wiki/
      weight: 5

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  description: "Theme PaperMod - https://github.com/adityatelange/hugo-PaperMod"
  author: Theme PaperMod
  # author: ["Me", "You"] # multiple authors

  defaultTheme: auto
  # disableThemeToggle: true
  ShowShareButtons: true
  ShowReadingTime: true
  # disableSpecial1stPost: true
  # Tags that denote a language, rendered as a chip by partials/post_meta.html. A language
  # tag missing from this list still filters correctly on /tags/, it just shows no chip.
  languageTags: ["English", "中文", "日本語"]
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  # comments: false
  images: ["images/papermod-cover.png"]

  profileMode:
    enabled: true           # 启用个人资料主页
    title: "Duzui"      # 主标题（通常是你的名字）
    subtitle: |
      👋 Welcome to my blog!

      ⭐I'm Duzui or duzui9039/duzuictx sometimes. I speak and write in english|普通话|日本語. 
      I'll post some casual passages here, mainly about the books I've read, projects I've done and my language learning experience. 
      También estoy aprendiendo español.
  # 副标题
    imageUrl: "/images/myicon.jpg"  # 头像图片 URL
    imageTitle: "icon"    # 头像的 alt 文本（无障碍/SEO）
    imageWidth: 120         # 可选：头像显示宽度
    imageHeight: 120        # 可选：头像显示高度
    buttons:
      - name: Blog
        url: posts/
  
